<!-- Banner con imagen de fondo original -->
<app-banner 
  [title]="'Make your travel wishlist, we\'ll do the rest'"
  [subtitle]="'Special offers to suit your plan'"
  [backgroundImage]="'/public/img/imagen.jpg'"
  [overlayGradient]="'linear-gradient(to right, rgba(35, 52, 99, 0.7), rgba(0, 0, 0, 0))'">
</app-banner>

<!-- Buscador -->
<div class="search-bar-container">
  <app-buscador-dinamico [tipoBusqueda]="'hoteles'"></app-buscador-dinamico>
</div>

<!-- Hoteles Recientes -->
<app-card-list
  [title]="'Hoteles que viste recientemente'"
  [items]="hotelesRecientes"
  [routePrefix]="'/hoteles/detalle'"
  [errorMessage]="mensajeError">
</app-card-list>

<!-- Hoteles Populares -->
<app-card-grid
  [title]="'¡Hoteles más populares!'"
  [description]="'Going somewhere to celebrate this season? Whether you\'re going home or somewhere to roam, we\'ve got the travel tools to get you to your destination.'"
  [items]="hotelesPopulares"
  [showButton]="true"
  [routePrefix]="'/hoteles/detalle'"
  [mode]="'hoteles'"
  [columns]="4"
  (buttonClick)="verTodosLosHoteles()">
</app-card-grid>
